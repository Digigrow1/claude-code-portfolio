# Optional hot-reload dev server. node_modules lives in a Docker volume so it
# never lands in the OneDrive-synced folder (decision/0010).
#   docker compose -f docker-compose.dev.yml up
#   -> http://localhost:5173
name: portfolio-dev

services:
  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    environment:
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
